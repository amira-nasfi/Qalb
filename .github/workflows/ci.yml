name: CI — Qalb Platform

on:
  push:
    branches: [main, develop, amira_dev]
  pull_request:
    branches: [main, amira_dev]

jobs:
  # ─────────────────────────────────────────────
  # Backend: Lint, Type-check, Unit Tests
  # ─────────────────────────────────────────────
  backend-tests:
    name: Backend — pytest + flake8
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: qalb_test_db
          POSTGRES_USER: qalb_user
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qalb_user -d qalb_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://qalb_user:ci_test_password@localhost:5432/qalb_test_db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-insecure-key-do-not-use-in-production
      FIELD_ENCRYPTION_KEY: MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8
        working-directory: backend
        run: |
          flake8 . \
            --max-line-length=120 \
            --exclude=migrations,venv,__pycache__ \
            --ignore=E221,E501,W293,W391,E302,E241,W291,F401,W503 \
            --count \
            --statistics

      - name: Run database migrations
        working-directory: backend
        run: python manage.py migrate --no-input

      - name: Run unit tests
        working-directory: backend
        run: pytest tests/ -v --tb=short

  # ─────────────────────────────────────────────
  # Frontend: Build & Type-check
  # ─────────────────────────────────────────────
  frontend-build:
    name: Frontend — TypeScript + Vite build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type-check & build
        working-directory: frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Docker: Build images (smoke test)
  # ─────────────────────────────────────────────
  docker-build:
    name: Docker — image build smoke test
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file from CI secrets
        run: |
          echo "SECRET_KEY=ci-insecure-key-do-not-use-in-production" >> .env
          echo "POSTGRES_PASSWORD=ci_test_password" >> .env
          echo "FIELD_ENCRYPTION_KEY=MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=" >> .env

      - name: Build Docker images
        run: docker compose build

      - name: Verify backend image starts
        run: |
          docker compose run --rm --no-deps backend python manage.py check --deploy --settings=config.settings.prod 2>&1 | grep -v "WARNINGS" || true
